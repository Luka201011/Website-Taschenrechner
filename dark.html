<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taschenrechner</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="dark.css">
    <script src="scripts.js"></script>
</head>
<body>  
<div class="calculator">
    <div class="display">
        <div class="result">0</div>
    </div>
    
    <div class="button-grid">
        <button class="button function">DEL</button>
        <button class="button function">+</button>
        <button class="button function">+/-</button>
        <button class="button function">÷</button>
        
        <button class="button number">7</button>
        <button class="button number">8</button>
        <button class="button number">9</button>
        <button class="button function">×</button>
        
        <button class="button number">4</button>
        <button class="button number">5</button>
        <button class="button number">6</button>
        <button class="button function">−</button>
        
        <button class="button number">1</button>
        <button class="button number">2</button>
        <button class="button number">3</button>
        <button class="button function equals" id="equals-tall">=</button>
        
        <button class="button number zero">0</button>
        <button class="button number">.</button>
    </div>
    
    <a class="Navigation" href="index.html">
        <div class="toggle">
            <div class="toggle-circle"></div>
        </div>
    </a>
    </div>
</div>


</body>
</html>
